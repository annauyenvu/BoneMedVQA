[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonemedvqa"
version = "0.1.0"
description = "BoneMedVQA — Musculoskeletal X-ray Visual Question Answering with Visual, Textual, and Latent Prompts"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "BoneMedVQA Research" }]
keywords = ["medical-imaging", "vqa", "multimodal", "x-ray", "pytorch"]
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "Pillow>=10.0",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "omegaconf>=2.3",
  "transformers>=4.38",
  "peft>=0.9",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.5",
  "gradio>=4.20",
  "tqdm>=4.66",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
  "pydicom>=2.4",
  "albumentations>=1.4",
  "einops>=0.7",
  "timm>=0.9",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
metrics = ["nltk>=3.8", "rouge-score>=0.1", "bert-score>=0.3", "evaluate>=0.4"]
monai = ["monai>=1.3"]

[project.scripts]
bonemedvqa-train = "bonemedvqa.cli:train_entry"
bonemedvqa-eval = "bonemedvqa.cli:eval_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
